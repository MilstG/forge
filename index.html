<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="description" content="Personal workout tracker with an AI coach" />

    <!-- installable app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />

    <title>Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0B0C0F; }
      * { -webkit-tap-highlight-color: transparent; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        /* stop the whole page rubber-banding on iOS while inner areas scroll */
        overscroll-behavior-y: none;
        position: fixed;
        width: 100%;
      }
      input, textarea, select, button { font-family: inherit; }
      /* 16px minimum stops iOS auto-zooming when a field is focused */
      input, textarea, select { font-size: 16px; }
      input::placeholder, textarea::placeholder { color: #4A4E55; }
      input[type="date"] { color-scheme: dark; }
      input:focus, textarea:focus, select:focus { border-color: #FF5F2E !important; }
      button:focus-visible, a:focus-visible { outline: 2px solid #FF5F2E; outline-offset: 2px; }
      /* generous hit targets for thumbs */
      button { min-height: 40px; touch-action: manipulation; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #25292F; border-radius: 3px; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
